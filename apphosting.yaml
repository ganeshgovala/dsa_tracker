# Firebase App Hosting configuration.
# https://firebase.google.com/docs/app-hosting/configure
#
# The NEXT_PUBLIC_* values are Firebase *web* config — safe to commit (they are
# already shipped in the browser bundle; access is controlled by Firestore rules
# + Auth, not by hiding the API key). The Admin SDK uses Application Default
# Credentials on App Hosting (the backend service account), so no service-account
# key file is needed in production.

runConfig:
  minInstances: 0
  maxInstances: 2

env:
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: AIzaSyDeXBUO71GKHja4-7nv6mYnD--6NL3TLFg
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: ganeshcodetracker.firebaseapp.com
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: ganeshcodetracker
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: ganeshcodetracker.firebasestorage.app
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: "709091312180"
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: "1:709091312180:web:83c44bdf64df36a5adc061"
    availability: [BUILD, RUNTIME]
